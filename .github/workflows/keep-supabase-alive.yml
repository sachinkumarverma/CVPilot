name: Keep Supabase Alive
on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth API
        # We query the PostgREST DB endpoint (/rest/v1/) and Auth endpoint.
        # Hitting /rest/v1/ executes a query on PostgreSQL, registering real database activity
        # which prevents Supabase from auto-pausing the project due to inactivity.
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"

          echo "Pinging Supabase PostgREST DB endpoint ($URL/rest/v1/)..."
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "PostgREST DB Response Code: $DB_STATUS"

          echo "Pinging Supabase Auth endpoint ($URL/auth/v1/health)..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Auth Response Code: $AUTH_STATUS"

          if [ "$DB_STATUS" = "000" ] || [ "$AUTH_STATUS" = "000" ]; then
            echo "Error: Could not connect to Supabase URL. Please check SUPABASE_URL in GitHub Secrets."
            exit 1
          fi

          echo "Supabase successfully pinged! DB Status: $DB_STATUS | Auth Status: $AUTH_STATUS"
