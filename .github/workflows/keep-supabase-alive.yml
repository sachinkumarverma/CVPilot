name: Keep Supabase Alive
on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth API
        # We query the PostgREST DB endpoint (/rest/v1/) and Auth endpoint.
        # Hitting /rest/v1/ executes a query on PostgreSQL, registering real database activity
        # which prevents Supabase from auto-pausing the project due to inactivity.
        run: |
          echo "Pinging Supabase PostgREST DB endpoint..."
          curl -s -f "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null

          echo "Pinging Supabase Auth endpoint..."
          curl -s -f "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null

          echo "Supabase successfully pinged!"
