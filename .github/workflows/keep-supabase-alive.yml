name: Keep Supabase Alive
on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        # We query the REST API with a limit of 1 to register activity.
        # This counts as an API request and will keep your project active.
        # Make sure to add SUPABASE_URL and SUPABASE_ANON_KEY to your GitHub repository secrets.
        run: |
          curl -s -f "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
